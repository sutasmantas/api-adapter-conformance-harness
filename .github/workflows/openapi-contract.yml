name: Reusable OpenAPI contract

on:
  workflow_call:
    inputs:
      adapterproof-ref:
        description: Exact AdapterProof Git commit used by the caller
        required: true
        type: string
      config:
        description: Consumer contract file
        required: false
        default: adapterproof.openapi.json
        type: string
      consumer-install-arguments:
        description: Arguments passed to the consumer environment's pip install
        required: false
        default: -e ".[dev]"
        type: string
      python-version:
        required: false
        default: "3.12"
        type: string

# Least privilege: these jobs only read the repository and run tests.
# Without this block the workflow inherits the repository default token
# scope, which can be read-write.
permissions:
  contents: read

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install consumer in isolation
        run: |
          python -m venv .consumer-venv
          .consumer-venv/bin/python -m pip install --upgrade pip
          # A consumer may depend on a vendored wheel that is not on any index.
          # Install whatever it vendors before installing the consumer itself,
          # or its own pin becomes unresolvable here.
          if compgen -G "vendor/*.whl" > /dev/null; then
            .consumer-venv/bin/python -m pip install vendor/*.whl
          fi
          .consumer-venv/bin/python -m pip install ${{ inputs.consumer-install-arguments }}
      - name: Check out the pinned AdapterProof implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sutasmantas/api-adapter-conformance-harness
          ref: ${{ inputs.adapterproof-ref }}
          path: .adapterproof-source
      - name: Install pinned GitHub tooling in isolation
        run: |
          python -m venv .adapterproof-venv
          .adapterproof-venv/bin/python -m pip install .adapterproof-source/vendor/deliveryguard-0.2.0-py3-none-any.whl
          .adapterproof-venv/bin/python -m pip install pytest-httpserver==1.1.5
          .adapterproof-venv/bin/python -m pip install --no-deps .adapterproof-source
          .adapterproof-venv/bin/python -m pip install "git+https://github.com/schemathesis/schemathesis.git@40e71c4657c79be08ea772b612a121b0e0ac7142"
      - name: Run bounded OpenAPI contract
        run: |
          .adapterproof-venv/bin/adapterproof openapi \
            --config "${{ inputs.config }}" \
            --consumer-python .consumer-venv/bin/python \
            --report-dir .evidence/openapi
      - name: Upload executable receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adapterproof-openapi-receipt
          path: .evidence/openapi/

name: AdapterProof

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repository and run tests.
# Without this block the workflow inherits the repository default token
# scope, which can be read-write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check adapterproof tests/test_adapterproof.py tests/test_openapi.py
      - run: python -m ruff format --check adapterproof tests/test_adapterproof.py tests/test_openapi.py
      - run: python -m mypy adapterproof
      - run: python -m pytest tests/test_adapterproof.py tests/test_openapi.py
      - run: python -m build
      - run: adapterproof run --database-dir .evidence/databases --output .evidence/report.json

name: AdapterProof

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install vendor/deliveryguard-0.1.0-py3-none-any.whl
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check adapterproof tests/test_adapterproof.py
      - run: python -m ruff format --check adapterproof tests/test_adapterproof.py
      - run: python -m mypy adapterproof
      - run: python -m pytest tests/test_adapterproof.py
      - run: python -m build
      - run: adapterproof run --database-dir .evidence/databases --output .evidence/report.json
